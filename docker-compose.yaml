services:
  postgres:
    image: postgres:16-alpine
    container_name: worklense-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-worklense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worklense}
      POSTGRES_DB: ${POSTGRES_DB:-worklense}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worklense"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - worklense-network

volumes:
  postgres-data:
    driver: local

networks:
  worklense-network:
    driver: bridge