x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow.Dockerfile
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: worklense-airflow-secret
    # Pass project env vars so DAGs / BashOperator inherit them
    ADZUNA_API_KEY: ${ADZUNA_API_KEY:-}
    ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
    FINDWORK_API_KEY: ${FINDWORK_API_KEY:-}
    DATABASE_URL: postgresql://worklense:worklense@postgres:5432/worklense
    OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral:7b}
    OLLAMA_TECH_MODEL: ${OLLAMA_TECH_MODEL:-qwen2.5:7b-instruct}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    AIRFLOW_SCHEDULE: ${AIRFLOW_SCHEDULE:-@daily}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./:/opt/airflow/project
    - airflow-logs:/opt/airflow/logs
  networks:
    - worklense-network
  depends_on:
    airflow-postgres:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  # ── WorkLense data store ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: worklense-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-worklense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worklense}
      POSTGRES_DB: ${POSTGRES_DB:-worklense}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worklense"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - worklense-network

  # ── Airflow metadata store ────────────────────────────────────────────
  airflow-postgres:
    image: postgres:16-alpine
    container_name: worklense-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    volumes:
      - airflow-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - worklense-network

  # ── Airflow init (runs once: db migrate + create admin) ───────────────
  airflow-init:
    <<: *airflow-common
    container_name: worklense-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@worklense.local || true
    restart: "no"
    depends_on:
      airflow-postgres:
        condition: service_healthy

  # ── Airflow webserver ─────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: worklense-airflow-webserver
    command: airflow webserver --port 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Airflow scheduler ─────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: worklense-airflow-scheduler
    command: airflow scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
    driver: local
  airflow-pg-data:
    driver: local
  airflow-logs:
    driver: local

networks:
  worklense-network:
    driver: bridge
